<!doctype html>
<html lang="en">
    <head>
		<meta http-equiv="content-type" content="text/html" charset=utf-8" />
		<link rel="stylesheet" href="../dist/styles.css" />
    </head>

    <body>
        <form>
            <label for="delay" title="Picture in Picture start delay after focus lost">focus lost delay</label>

			<div id="delay-opts">
            <input type="range" id="delay" value="0" min="0.00" max="5" step=".01">
            <label id="delay-value"></label>
			</div>

			<div id="debugging-opts">
			<input type="checkbox" id="debugging"></input>
            <label for="debugging">Enable debugging</label>
			</div>
            <button id="submit" type="button">Save</button>
        </form>

		<div id="debug-panel" class="hidden">
			<a href="https://github.com/gavink97/pipn" id="create-issue">Create an issue</a>
			<textarea id="debug-specs" rows="3" cols="40" readonly></textarea>
			<textarea id="debug-box" rows="20" cols="40" readonly></textarea>
		</div>

        <script src="../../dist/styles.css" type="text/"></script>
        <script src="../../dist/options.js" type="text/javascript"></script>
    </body>
</html>
